# Configuracao da extensao Continue (VS Code) pro Ayran.
# Copiada pra ~/.continue/config.yaml. Neste PC fala direto com o Ollama local.
name: Ayran
version: 0.1.0
schema: v1

models:
  - name: Ayran Code
    provider: ollama
    model: ayran-code
    apiBase: http://127.0.0.1:11434
    roles: [chat, edit, apply]
    capabilities: [tool_use]
    defaultCompletionOptions:
      contextLength: 32768

  - name: Ayran Rapido
    provider: ollama
    model: qwen3.5:4b
    apiBase: http://127.0.0.1:11434
    roles: [chat, edit]
    defaultCompletionOptions:
      contextLength: 8192

  - name: Ayran Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://127.0.0.1:11434
    roles: [autocomplete]

  - name: Ayran Embeddings
    provider: ollama
    model: bge-m3
    apiBase: http://127.0.0.1:11434
    roles: [embed]

# As regras completas (server/vscode/ayran-code-rules.md) sao copiadas pra ~/.continue/rules/,
# que o Continue carrega sozinho.
